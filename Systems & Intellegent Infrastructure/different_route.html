<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technion CS — Systems & Performance Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0d1f3c;
    --navy2:   #122850;
    --blue:    #1a4a8a;
    --accent:  #76b900; /* Updated to NVIDIA Green */
    --sky:     #4da3d4;
    --frost:   #c8ddf0;
    --ice:     #e8f2fa;
    --white:   #ffffff;
    --gray:    #f4f7fb;
    --text:    #1e2d42;
    --muted:   #6b7f99;
    --border:  #ccdaea;
    --mono:    'IBM Plex Mono', monospace;
    --sans:    'IBM Plex Sans', sans-serif;
    --display: 'Space Grotesk', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--navy);
    color: var(--text);
    min-height: 100vh;
    padding: 48px 24px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(118,185,0,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 85% 80%, rgba(13,31,60,0.8) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
  }

  .header {
    margin-bottom: 48px;
    animation: fadeUp 0.6s ease both;
  }

  .header-eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .badge {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(118,185,0,0.12);
    border: 1px solid rgba(118,185,0,0.3);
    padding: 4px 10px;
    border-radius: 3px;
  }

  .header h1 {
    font-family: var(--display);
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 700;
    color: var(--white);
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .header h1 span {
    color: var(--accent);
  }

  .header-sub {
    margin-top: 10px;
    font-size: 16px;
    font-weight: 300;
    color: rgba(200,220,240,0.7);
    letter-spacing: 0.01em;
  }

  .header-rule {
    margin-top: 24px;
    height: 1px;
    background: linear-gradient(to right, var(--accent), transparent);
  }

  .stats-row {
    display: flex;
    gap: 32px;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-value {
    font-family: var(--display);
    font-size: 26px;
    font-weight: 700;
    color: var(--white);
    line-height: 1;
  }

  .stat-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .semesters {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .semester {
    background: rgba(255,255,255,0.97);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.25);
    animation: fadeUp 0.5s ease both;
  }

  .sem-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    background: var(--navy2);
  }

  .sem-num {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 3px 8px;
    border: 1px solid rgba(118,185,0,0.4);
    border-radius: 3px;
  }

  .sem-title {
    font-family: var(--display);
    font-size: 15px;
    font-weight: 600;
    color: var(--white);
    margin-left: 10px;
  }

  .course-row {
    display: grid;
    grid-template-columns: 110px 1fr 60px;
    padding: 12px 22px;
    border-bottom: 1px solid #eef3f8;
    align-items: center;
    text-decoration: none;
    transition: background 0.15s;
  }

  .course-row:hover { background: #f0f6fc; border-left: 3px solid var(--accent); }

  .course-code { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--blue); }
  .course-name { font-size: 13.5px; font-weight: 400; color: var(--text); }
  .course-pts { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--navy); text-align: right; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .footer {
    margin-top: 48px;
    padding-bottom: 48px;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    color: rgba(200,220,240,0.3);
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="header-eyebrow"><span class="badge">NVIDIA Performance Track</span></div>
    <h1>Technion CS<br><span>Hardware & AI</span> Roadmap</h1>
    <div class="header-sub">6-Semester Custom Curriculum · Computer Science</div>
    <div class="header-rule"></div>
    <div class="stats-row">
      <div class="stat"><div class="stat-value">6</div><div class="stat-label">Semesters</div></div>
      <div class="stat"><div class="stat-value">29</div><div class="stat-label">Courses</div></div>
      <div class="stat"><div class="stat-value">88.5</div><div class="stat-label">Total Pts</div></div>
    </div>
  </div>

  <div class="semesters" id="roadmap-container"></div>

  <div class="footer"> GOOD LUCK :) </div>

</div>

<script>
const data = [
  { num: 1, title: "Foundation & Core Theory", pts: "13.5", courses: [
    {id: "234123", name: "Operating Systems", pts: "4.5"},
    {id: "236267", name: "Computer Architecture", pts: "3.0"},
    {id: "236343", name: "Theory of Computation", pts: "3.0"},
    {id: "234292", name: "Logic For CS", pts: "3.0"}
  ]},
  { num: 2, title: "AI Start & Systems Base", pts: "14.0", courses: [
    {id: "236501", name: "Intro to Artificial Intelligence", pts: "3.0"},
    {id: "236334", name: "Intro to Computer Networks", pts: "3.0"},
    {id: "236363", name: "Databases", pts: "3.0"},
    {id: "134058", name: "Biology 1", pts: "3.0"},
    {id: "236013", name: "Performance Engineering", pts: "2.0"}
  ]},
  { num: 3, title: "ML Theory, Verification & Security", pts: "15.5", courses: [
    {id: "236756", name: "Intro to Machine Learning", pts: "3.5"},
    {id: "236342", name: "Intro to Software Verification", pts: "3.0"},
    {id: "236360", name: "Theory of Compilation", pts: "3.0"},
    {id: "236322", name: "Information Storage Systems", pts: "3.0"},
    {id: "236350", name: "Network Security", pts: "3.0"}
  ]},
  { num: 4, title: "ML Systems & Kernel", pts: "15.0", courses: [
    {id: "236370", name: "Concurrent & Distributed ML", pts: "3.0"},
    {id: "236009", name: "Linux Kernel Development", pts: "3.0"},
    {id: "236422", name: "Advanced Storage Systems", pts: "3.0"},
    {id: "236341", name: "Internet Networking", pts: "3.0"},
    {id: "236491", name: "Secure Programming", pts: "3.0"}
  ]},
  { num: 5, title: "Distributed Systems & Scale", pts: "14.5", courses: [
    {id: "236351", name: "Distributed Systems", pts: "3.0"},
    {id: "236278", name: "Computational Accelerators", pts: "3.0"},
    {id: "236345", name: "Automatic Verification of HW/SW", pts: "3.0"},
    {id: "236371", name: "Project in Parallel/Dist.", pts: "3.0"},
    {id: "104033", name: "Vector Analysis", pts: "2.5"}
  ]},
  { num: 6, title: "Capstone Mastery", pts: "14.0", courses: [
    {id: "236781", name: "Deep Learning on Accelerators", pts: "3.0"},
    {id: "236509", name: "Advanced Computer Architecture", pts: "3.0"},
    {id: "236755", name: "Distributed Algorithms", pts: "3.0"},
    {id: "236366", name: "Project in Operating Systems", pts: "3.0"},
    {id: "236005", name: "Advanced Topics in OS", pts: "2.0"}
  ]}
];
const container = document.getElementById('roadmap-container');
let grandTotal = 0;

data.forEach(sem => {
  const semEl = document.createElement('div');
  semEl.className = 'semester';
  
  // LOGIC: Calculate semester points dynamically
  const calculatedSemPts = sem.courses.reduce((sum, c) => sum + parseFloat(c.pts), 0);
  grandTotal += calculatedSemPts;

  semEl.innerHTML = `
    <div class="sem-header">
      <div><span class="sem-num">Sem ${sem.num}</span><span class="sem-title">${sem.title}</span></div>
      <span style="color:rgba(255,255,255,0.5); font-family:var(--mono); font-size:12px;">${calculatedSemPts.toFixed(1)} PTS</span>
    </div>
    <div class="course-rows">
      ${sem.courses.map(c => `
        <a href="https://students.technion.ac.il/local/technionsearch/course/${c.id}" target="_blank" class="course-row">
          <span class="course-code">${c.id}</span>
          <span class="course-name">${c.name}</span>
          <span class="course-pts">${c.pts}</span>
        </a>
      `).join('')}
    </div>
  `;
  container.appendChild(semEl);
});

// Update the Top Stat badge if it exists
const totalBadge = document.querySelector('.stat-value:last-child'); // Target the "88.5" value
if(totalBadge) totalBadge.innerText = grandTotal.toFixed(1);
</script>
</body>
</html>
